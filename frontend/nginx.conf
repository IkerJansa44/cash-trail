server {
  listen 80;
  server_name _;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_read_timeout 150s;
  }

  location /cash-trail/api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_read_timeout 150s;
  }

  location = /cash-trail/manifest.webmanifest {
    alias /usr/share/nginx/html/manifest.webmanifest;
    default_type application/manifest+json;
  }

  location = /cash-trail/sw.js {
    alias /usr/share/nginx/html/sw.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    alias /usr/share/nginx/html/manifest.webmanifest;
    default_type application/manifest+json;
  }

  location = /sw.js {
    alias /usr/share/nginx/html/sw.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
  }

  location /cash-trail/assets/ {
    rewrite ^/cash-trail/(.*)$ /$1 break;
    root /usr/share/nginx/html;
    try_files $uri =404;
  }

  location /cash-trail/ {
    rewrite ^/cash-trail/(.*)$ /$1 break;
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
